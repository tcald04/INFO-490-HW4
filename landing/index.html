<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Folio Prototypes</title>
    <style>
      :root {
        --bg: #f6f5f1;
        --card: #ffffff;
        --text: #1f1f1d;
        --muted: #6b6a65;
        --line: #e2e0d9;
        --accent: #2f5d50;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
      h1 { font-size: 1.6rem; margin: 0 0 4px; }
      .sub { color: var(--muted); margin: 0 0 32px; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
      a.model {
        display: block;
        padding: 18px 20px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: inherit;
        text-decoration: none;
      }
      a.model:hover, a.model:focus-visible { border-color: var(--accent); }
      .label { font-size: 0.8rem; color: var(--accent); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
      .name { font-size: 1.1rem; font-weight: 600; margin: 2px 0; }
      .desc { color: var(--muted); font-size: 0.9rem; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Travel Folio</h1>
      <p class="sub">INFO 490 · Interaction-model prototypes</p>
      <ul>
        <li>
          <a class="model" href="./model-a/">
            <div class="label">Model A</div>
            <div class="name">Collection Board</div>
            <p class="desc">Organize saved places into collections.</p>
          </a>
        </li>
        <li>
          <a class="model" href="./model-b/">
            <div class="label">Model B</div>
            <div class="name">Timeline Planner</div>
            <p class="desc">Plan the trip day by day on a timeline.</p>
          </a>
        </li>
        <li>
          <a class="model" href="./model-c/">
            <div class="label">Model C</div>
            <div class="name">Location Map</div>
            <p class="desc">Explore and plan saved places by location.</p>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
